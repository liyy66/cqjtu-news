# ============================================================
#  Crawl CQJTU News - automated news fetch
#
#  Runs on GitHub's cloud every 6 hours. No local machine needed.
#  NOTE: file is intentionally ASCII-only because GitHub renders
#  workflow names in the sidebar; keeping it ASCII avoids any
#  encoding surprises in logs.
# ============================================================

name: Crawl CQJTU News

# Every 6 hours. Cron is UTC: 01/07/13/19 UTC
# = 09/15/21/03 Beijing time.
on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

# Only one run at a time, so two crawls never overwrite news.json
concurrency:
  group: crawl-cqjtu
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Crawl and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore previous crawl state
        run: |
          # state/news.jsonl is the incremental baseline. With it we
          # only fetch new articles; without it the first run does a
          # full crawl of ~2400 articles (slow but expected).
          if [ -f state/news.jsonl ]; then
            python scripts/repo_state.py import
          else
            echo "First run: full crawl, this takes a while."
            mkdir -p data
            echo '[]' > data/news.json
          fi

      - name: Crawl and rebuild site data
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          TZ: Asia/Shanghai
        run: |
          python scripts/daily_update.py
          python scripts/repo_state.py export

      - name: Show report
        run: cat data/_last_update.json

      - name: Build commit message
        run: |
          python scripts/make_commit_msg.py

      - name: Commit data changes
        id: commit
        run: |
          git config user.name  "cqjtu-news-bot"
          git config user.email "cqjtu-news-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new articles this round."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -F commit_msg.txt
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Pages deploy is optional: it only works after the repo owner
      # sets Settings > Pages > Source = GitHub Actions once.
      # Crawling and committing must not depend on it.
      - name: Upload site artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
